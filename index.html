<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille Technologique : IA et Handicap</title>
    <style>
        /* Styles de base pour l'accessibilité */
        :root {
            --bg-color: #f9f9f9;
            --text-color: #222;
            --card-bg: #fff;
            --primary-color: #0056b3;
            --border-color: #ccc;
            --font-size: 16px;
        }

        body.high-contrast {
            --bg-color: #000;
            --text-color: #fff;
            --card-bg: #111;
            --primary-color: #ff0;
            --border-color: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            font-size: var(--font-size);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Barre d'accessibilité en haut */
        .accessibility-bar {
            background: #e9ecef;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .accessibility-bar button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
        }

        .accessibility-bar button:focus {
            outline: 3px solid #ff9900;
        }

        /* Filtres */
        .filters {
            text-align: center;
            margin-bottom: 20px;
        }

        .filters select {
            padding: 8px;
            font-size: 1em;
            margin: 5px;
        }

        /* Grille des articles */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .article-card h2 a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .article-card h2 a:hover, .article-card h2 a:focus {
            text-decoration: underline;
            outline: 3px solid #ff9900;
        }

        .tag {
            display: inline-block;
            background: #e2e8f0;
            color: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-right: 5px;
        }

        body.high-contrast .tag {
            background: #333;
            color: #fff;
            border: 1px solid #fff;
        }

        .simple-version {
            background: #e6f4ea;
            border-left: 4px solid #34a853;
            padding: 10px;
            margin-top: 10px;
            display: none;
        }

        body.high-contrast .simple-version {
            background: #003300;
            border-left: 4px solid #00ff00;
        }

        button.toggle-simple {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Barre d'accessibilité pour les réglages -->
    <div class="accessibility-bar" role="region" aria-label="Paramètres d'accessibilité">
        <span>Accessibilité : </span>
        <button onclick="changerTaille('plus')">Agrandir le texte</button>
        <button onclick="changerTaille('moins')">Réduire le texte</button>
        <button onclick="alternerContraste()">Activer/Désactiver le fort contraste</button>
    </div>

    <header>
        <h1>Journal de Veille : IA et Handicap</h1>
        <p>Les actualités quotidiennes sur l'intelligence artificielle au service de la compensation du handicap.</p>
    </header>

    <!-- Zone de filtres -->
    <div class="filters">
        <label for="filtre-handicap">Filtrer par handicap : </label>
        <select id="filtre-handicap" onchange="filtrerArticles()">
            <option value="tous">Tous les handicaps</option>
            <option value="visuel">Visuel</option>
            <option value="auditif">Auditif</option>
            <option value="moteur">Moteur</option>
        </select>
    </div>

    <!-- Conteneur où les articles vont s'afficher tout seul -->
    <main id="liste-articles" tabindex="0">
        <p>Chargement des articles en cours...</p>
    </main>

    <script>
        let tousLesArticles = [];

        // 1. Charger le fichier data.json automatiquement
        fetch('data.json')
            .then(reponse => reponse.json())
            .then(donnees => {
                tousLesArticles = donnees;
                afficherArticles(tousLesArticles);
            })
            .catch(erreur => {
                console.error("Erreur de chargement :", erreur);
                document.getElementById('liste-articles').innerHTML = "<p>Erreur : impossible de charger les articles.</p>";
            });

        // 2. Afficher les articles sur la page
        function afficherArticles(articles) {
            const conteneur = document.getElementById('liste-articles');
            conteneur.innerHTML = "";

            if (articles.length === 0) {
                conteneur.innerHTML = "<p>Aucun article ne correspond à ce filtre.</p>";
                return;
            }

            articles.forEach((article, index) => {
                const carte = document.createElement('article');
                carte.className = 'article-card';
                carte.innerHTML = `
                    <h2><a href="${article.lien}" target="_blank">${article.titre}</a></h2>
                    <p><strong>Source :</strong> ${article.source} | <strong>Date :</strong> ${article.date} | <strong>Note :</strong> ${article.note}</p>
                    <div>
                        <span class="tag">Handicap : ${article.handicap}</span>
                        <span class="tag">Maturité : ${article.maturite}</span>
                    </div>
                    <p style="margin-top: 15px;">${article.resume}</p>
                    <p><strong>Pourquoi c'est important :</strong> ${article.important}</p>
                    <button class="toggle-simple" onclick="basculerVersionSimple(${index})">Afficher / Masquer la version simple (FALC)</button>
                    <div id="simple-${index}" class="simple-version">
                        <p><strong>Version simple :</strong> ${article.version_simple}</p>
                    </div>
                `;
                conteneur.appendChild(carte);
            });
        }

        // 3. Fonction pour filtrer selon le choix
        function filtrerArticles() {
            const choix = document.getElementById('filtre-handicap').value;
            if (choix === 'tous') {
                afficherArticles(tousLesArticles);
            } else {
                const articlesFiltres = tousLesArticles.filter(a => a.handicap === choix);
                afficherArticles(articlesFiltres);
            }
        }

        // 4. Fonction pour afficher/cacher la version simple
        function basculerVersionSimple(index) {
            const bloc = document.getElementById(`simple-${index}`);
            if (bloc.style.display === 'block') {
                bloc.style.display = 'none';
            } else {
                bloc.style.display = 'block';
            }
        }

        // 5. Accessibilité : Agrandir / Réduire le texte
        let tailleActuelle = 16;
        function changerTaille(sens) {
            if (sens === 'plus' && tailleActuelle < 24) {
                tailleActuelle += 2;
            } else if (sens === 'moins' && tailleActuelle > 12) {
                tailleActuelle -= 2;
            }
            document.documentElement.style.setProperty('--font-size', tailleActuelle + 'px');
        }

        // 6. Accessibilité : Fort contraste
        function alternerContraste() {
            document.body.classList.toggle('high-contrast');
        }
    </script>
</body>
</html>
